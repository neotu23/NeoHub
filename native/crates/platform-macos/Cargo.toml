[package]
name = "neohub-platform-macos"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "NeoHub macOS platform services (keychain, open-in, deep links, tray, dock)"

[target.'cfg(target_os = "macos")'.dependencies]
aes-gcm = "0.10"
base64 = "0.22"
rand = "0.9"
libc = "0.2"
security-framework = "3.7"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSRunningApplication"] }
objc2-foundation = { version = "0.3", features = ["NSString"] }
tray-icon = "0.26"
muda = "0.21"

[dependencies]
neohub-storage = { path = "../storage" }
neohub-core = { path = "../core" }
neohub-domain = { path = "../domain" }
thiserror = "2.0"
