[package]
name = "neohub-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "NeoHub background core: catalog rules, process control, orchestration"

[dependencies]
neohub-domain = { path = "../domain" }
neohub-storage = { path = "../storage" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
semver = "1.0"
thiserror = "2.0"

portable-pty = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "io-util"] }
libc = "0.2"
vte = "0.15"
unicode-width = "0.2"
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking", "json"] }
futures = "0.3"
notify = "8"
glob = "0.3"

[dev-dependencies]
rusqlite = { version = "0.37" }
tempfile = "3.14"
